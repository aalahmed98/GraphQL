<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPA with Multiple CSS Files</title>
  <!-- Load CSS files for each container -->
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="profile.css">
  <!-- General container visibility styles -->
  <style>
    .container {
      display: none;
    }
    .active {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Login Container -->
  <div id="loginContainer" class="container active">
    <h2>Login</h2>
    <input id="username" placeholder="Username or Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>
  
  <!-- Profile Container -->
   
  <div id="profileContainer" class="container">
    <h1 id="welcomeMessage"></h1>
    <p id="auditRatioDisplay"></p>
    <button id="logoutBtn">Logout</button>
  </div>

  
  <!-- Make sure switcher.js is loaded before app.js -->
  <script src="switcher.js"></script>
  <script src="app.js"></script>
</body>
</html>
