<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Page</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .chart { margin-top: 20px; }
    button { padding: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Login</h2>
  <input id="username" placeholder="Username or Email" />
  <input id="password" type="password" placeholder="Password" />
  <button id="loginBtn">Login</button>
  
  <h2 id="profile">Profile</h2>
  <p id="usernameDisplay"></p>
  <div id="xpChart" class="chart"></div>

  <script src="app.js"></script>
  <script>
    // Ensure DOM elements and functions are properly linked
    window.addEventListener('DOMContentLoaded', () => {
      const loginButton = document.getElementById('loginBtn');
      if (typeof handleLogin === 'function') {
        loginButton.addEventListener('click', handleLogin);
        console.log('Login button linked to handleLogin function.');
      } else {
        console.error('handleLogin function is not defined in app.js');
      }
    });
  </script>
</body>
</html>
